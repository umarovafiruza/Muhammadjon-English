<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aloud - English Speaking Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg: #ffffff;
  --surface: #fafafa;
  --text: #111111;
  --muted: #666666;
  --border: #e6e6e6;
  --border-dark: #111111;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*, *::before, *::after{
  box-sizing: border-box;
}

[hidden]{
  display: none !important;
}

html, body{
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  width: 100%;
  min-height: 100vh;
}

html.in-reader, html.in-reader body{
  overflow: hidden;
}

button, input{
  font: inherit;
  color: inherit;
}

:focus-visible{
  outline: 2px solid var(--text);
  outline-offset: 3px;
}

/* Minimalist Text Buttons (No icons, no emoji) */
.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.02em;
  padding: 10px 18px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  white-space: nowrap;
  user-select: none;
  text-decoration: none;
  min-height: 40px;
}

.btn:hover{
  border-color: var(--text);
  background: var(--surface);
}

.btn:active{
  background: #f0f0f0;
}

.btn.primary{
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.btn.primary:hover{
  background: #333333;
  border-color: #333333;
}

.btn.text-link{
  border: none;
  background: transparent;
  padding: 8px 12px;
  color: var(--muted);
}

.btn.text-link:hover{
  color: var(--text);
  background: transparent;
  text-decoration: underline;
}

/* ---------- Home View ---------- */
.home{
  max-width: 1080px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

.header{
  margin-bottom: 56px;
}

.brand{
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 16px;
  display: block;
}

h1{
  font-size: clamp(34px, 6vw, 56px);
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.03em;
  margin: 0 0 16px;
  max-width: 24ch;
}

.subhead{
  font-size: clamp(16px, 2.2vw, 19px);
  color: var(--muted);
  max-width: 44ch;
  margin: 0;
  line-height: 1.6;
}

.topics-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
  gap: 20px;
  margin-top: 40px;
}

.card{
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 28px 24px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

.card:hover{
  border-color: var(--text);
  background: var(--surface);
}

.card-number{
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 12px;
}

.card-title{
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.3;
  margin: 0 0 8px;
  color: var(--text);
}

.card-desc{
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 24px;
  flex-grow: 1;
}

.card-meta{
  font-size: 12px;
  letter-spacing: 0.03em;
  color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  justify-content: space-between;
}

/* ---------- Reader View ---------- */
.reader{
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  max-width: 900px;
  margin: 0 auto;
  padding: 16px 24px 20px;
}

.reader-header{
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.reader-title{
  text-align: center;
  min-width: 0;
}

.reader-title strong{
  display: block;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.reader-title span{
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.reader-status{
  text-align: right;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 70px;
}

/* Reading Stage */
.stage{
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  margin-block: 8px;
}

/* Static Vignette Gradients */
.stage-gradient-top{
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: linear-gradient(to bottom, var(--bg) 0%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
  z-index: 2;
}

.stage-gradient-bottom{
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: linear-gradient(to top, var(--bg) 0%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
  z-index: 2;
}

/* Focus Point Indicator Line (at ~40% height) */
.focus-line{
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 140px;
  height: 1px;
  background: var(--text);
  pointer-events: none;
  z-index: 2;
  opacity: 0.7;
}

/* Continuous Scroller */
.scroller{
  position: relative;
  max-width: 360px; /* Tuned so exactly ~4 words fit per line */
  width: 100%;
  margin: 0 auto;
  padding: 0 16px 70vh;
  will-change: transform;
  transform: translateZ(0);
  backface-visibility: hidden;
  contain: layout style paint;
  text-align: center;
}

.text-content{
  margin: 0 auto;
  font-weight: 400;
  font-size: clamp(23px, 4.8vw, 32px);
  line-height: 1.7;
  letter-spacing: -0.015em;
  max-width: 18ch; /* ~4 words per line */
  text-align: center;
  word-break: normal;
  overflow-wrap: break-word;
  color: var(--text);
}

.w{
  display: inline-block;
  color: var(--text);
  margin: 0 4px;
}

/* Prompt Banner / Countdown Overlay */
.overlay{
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 24px;
  background: var(--bg);
  z-index: 5;
}

.ov-box{
  max-width: 420px;
  width: 100%;
}

.ov-prompt{
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.25;
  margin: 0 0 16px;
}

.ov-count{
  font-size: 72px;
  font-weight: 400;
  line-height: 1;
  color: var(--text);
  margin: 16px 0;
}

.ov-finished-time{
  font-size: 48px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
}

.ov-finished-sub{
  font-size: 15px;
  color: var(--muted);
  margin: 0 0 28px;
}

.ov-actions{
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* Controls (Text buttons only, Speed slider max 260) */
.controls{
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.ctrl-actions{
  display: flex;
  align-items: center;
  gap: 10px;
}

.ctrl-speed{
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
  min-width: 240px;
}

.ctrl-speed span{
  min-width: 44px;
}

.ctrl-speed output{
  min-width: 2.8em;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--text);
  text-align: right;
}

input[type=range]{
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 20px;
  background: transparent;
  margin: 0;
  cursor: pointer;
}

input[type=range]::-webkit-slider-runnable-track{
  height: 2px;
  background: var(--border);
}

input[type=range]::-moz-range-track{
  height: 2px;
  background: var(--border);
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--text);
  border: 1px solid var(--text);
}

input[type=range]::-moz-range-thumb{
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--text);
  border: 1px solid var(--text);
}

@media (max-width: 600px){
  .home{
    padding: 32px 16px 60px;
  }
  .reader{
    padding: 12px 16px 16px;
  }
  .controls{
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  .ctrl-actions{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ctrl-speed{
    width: 100%;
  }
}
</style>
</head>
<body>

<!-- Home View -->
<main id="homeView" class="home">
  <header class="header">
    <span class="brand">Aloud</span>
    <h1>English Speaking Practice</h1>
    <p class="subhead">Ten comforting reflections. Read aloud smoothly, stay present, and build speaking confidence with every word.</p>
  </header>

  <div class="topics-grid" id="topicsGrid"></div>
</main>

<!-- Reader View -->
<main id="readerView" class="reader" hidden>
  <header class="reader-header">
    <button class="btn text-link" id="btnBack" type="button">Back</button>
    <div class="reader-title">
      <strong id="readerTitle"></strong>
      <span id="readerSub"></span>
    </div>
    <div class="reader-status">
      <span id="readerProgress">0 / 0</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="stage-gradient-top" aria-hidden="true"></div>
    <div class="stage-gradient-bottom" aria-hidden="true"></div>
    
    <!-- Small horizontal line marking the focus reading point -->
    <div class="focus-line" aria-hidden="true"></div>

    <div class="scroller" id="scroller">
      <p class="text-content" id="textContent"></p>
    </div>

    <!-- Overlay for Preroll & Finished -->
    <div class="overlay" id="overlay" hidden>
      <div class="ov-box" id="ovPrerollBox">
        <p class="ov-prompt">Speak fast and clear</p>
        <div class="ov-count" id="ovCountdown">3</div>
      </div>
      <div class="ov-box" id="ovDoneBox" hidden>
        <h2 style="font-size:24px;font-weight:500;margin:0 0 16px">Finished</h2>
        <div class="ov-finished-time" id="doneTime">0:00</div>
        <div class="ov-finished-sub" id="doneSpeed">Average speed: 120 wpm</div>
        <div class="ov-actions">
          <button class="btn primary" id="btnReadAgain" type="button">Read Again</button>
          <button class="btn" id="btnNextTopic" type="button">Next Topic</button>
          <button class="btn" id="btnDoneBack" type="button">Back to Topics</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-actions">
      <button class="btn primary" id="btnTogglePlay" type="button">Pause</button>
      <button class="btn" id="btnRestart" type="button">Restart</button>
    </div>

    <div class="ctrl-speed">
      <span>Speed:</span>
      <input id="wpmSlider" type="range" min="60" max="260" step="5" value="120" aria-label="Reading speed slider">
      <output id="wpmOutput">120</output>
      <span>wpm</span>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';

/* ---------------- 10 Warm, Comforting, Motivational Direct-Address Texts (CEFR A1-B1) ---------------- */
var TOPICS = [
{
  id: 'doing-enough',
  title: 'You Are Doing Enough',
  desc: 'A gentle reminder that your quiet daily efforts are worthy and valuable.',
  level: 'A2',
  text: `Take a slow, deep breath right now. You are doing much better than you think. Every single day, you wake up and try your best, even when life feels heavy. Sometimes progress is quiet. It is not always a big victory. Progress can be getting out of bed, drinking water, and choosing to keep going. Do not compare your beginning to someone else's middle. You have survived every difficult day so far. Your journey is yours alone, and there is no need to hurry. Trust the pace of your life. Be gentle with your thoughts today. You do not have to prove anything to anyone. You are worthy of love, peace, and rest just as you are right now. Keep moving forward softly.`
},
{
  id: 'trust-voice',
  title: 'Trust Your Voice',
  desc: 'Speak with courage, embrace small mistakes, and let your voice be heard.',
  level: 'A2',
  text: `Your voice matters more than you realize. It is okay if your hands shake when you speak. It is okay if you make mistakes or forget a word. What truly matters is the courage inside your heart. When you speak, you share your unique view of this world. Nobody else has lived your story. Nobody else has your exact dreams and thoughts. English is simply a bridge to connect your heart with other people. Do not let fear build a wall around you. Every time you practice aloud, you take one step closer to freedom. Be proud of every single sentence you speak today. You are brave for trying. Believe in your voice, because the world is ready to listen to you.`
},
{
  id: 'fresh-start',
  title: 'A Fresh Start Today',
  desc: 'Leave past regrets behind and welcome the quiet hope of this new day.',
  level: 'A2',
  text: `Yesterday is already gone, and you cannot change it. But today is a fresh piece of paper waiting for your words. Whatever mistakes you made yesterday, leave them behind you. The morning sun rises every day to remind you that new beginnings are always possible. You do not need to wait for Monday or next year to start again. You can begin right now, in this very moment. Give yourself permission to let go of old regrets. Focus on the small good things around you: the warm light, a kind smile, or a hot cup of tea. Take one gentle step forward. You have the power to create a peaceful and joyful day for yourself.`
},
{
  id: 'small-steps',
  title: 'The Power of Small Steps',
  desc: 'Consistency and patience turn small daily habits into lasting growth.',
  level: 'B1',
  text: `Big dreams are not built in one day. They are created with small, quiet steps that you take every day. When you practice speaking English for ten minutes, it might feel small. But over months and years, those ten minutes will transform your life completely. Think of a giant tree. It begins as a tiny seed in the dark earth. It grows slowly, day by day, reaching for the sky. You are growing just like that tree. Even when you cannot see the change, your roots are growing deeper and stronger. Do not be impatient with your progress. Consistency is your greatest friend. Trust the process and celebrate every little step you take today.`
},
{
  id: 'rest-not-giving-up',
  title: 'Rest Is Not Giving Up',
  desc: 'Resting is a necessary, restorative part of every meaningful journey.',
  level: 'A2',
  text: `When you feel tired, remember that rest is a necessary part of your journey. Resting does not mean you are lazy, and it does not mean you are giving up. Even the strongest engines need time to cool down. Even the earth rests during the quiet winter before blooming in spring. Give yourself the quiet care you so freely give to others. Put down your worries for a little while. Close your eyes, relax your shoulders, and listen to the rhythm of your breath. Tomorrow will bring fresh energy and new strength. Treat yourself with kindness and patience. You are a human being, not a machine, and you deserve time to heal and recharge your soul.`
},
{
  id: 'not-alone',
  title: 'You Are Not Alone',
  desc: 'We all share silent struggles, hopes, and the warmth of human connection.',
  level: 'B1',
  text: `In moments of silence, you might feel like you are walking this road completely alone. But millions of people around the world feel the exact same feelings right now. Everyone has fears, doubts, and quiet struggles that they never show outside. You are connected to all of them through our shared human heart. When you feel lonely, look up at the night sky. The same stars shine above all of us. Remember the people who care about you, even from afar. Never hesitate to reach out for a kind hand or a warm conversation. You belong here in this world, and your presence brings light to places you may never even see.`
},
{
  id: 'embracing-imperfection',
  title: 'Embracing Imperfection',
  desc: 'Free yourself from the pressure of perfection and speak from the heart.',
  level: 'A2',
  text: `Perfection is an illusion that steals our joy. You do not need to speak perfect English, and you do not need to live a perfect life. In fact, our little flaws and mistakes are what make us real and beautiful. When you stumble on a word, simply laugh and continue. True communication is not about flawless grammar; it is about sharing feelings and connecting with another human being. When you accept your imperfections, a heavy burden falls off your shoulders. You become free to explore, to learn, and to grow without fear. Celebrate who you are today with all your quirks and colors. You are wonderfully human, and that is more than enough.`
},
{
  id: 'courage-over-comfort',
  title: 'Courage Over Comfort',
  desc: 'Step into the unknown and discover the quiet strength waiting inside you.',
  level: 'B1',
  text: `Stepping out of your comfort zone is never easy. It feels scary because you are entering the unknown. But comfort never taught anyone how to fly. Growth only happens when you are willing to feel a little uncomfortable. When you push past that fear, you discover strength you never knew you had. Do not wait until you feel completely ready, because that day may never arrive. Start before you are ready. Speak before you feel completely confident. Every time you choose courage over comfort, you build a stronger, wiser version of yourself. You are capable of handling whatever comes your way. Trust yourself and take the leap.`
},
{
  id: 'gratitude-for-moment',
  title: 'Gratitude for the Moment',
  desc: 'Slow down, breathe in, and find peace in this exact present moment.',
  level: 'A2',
  text: `Stop for a moment and look around you. Life is not happening in the distant future or in the past. Life is happening right now in this exact second. Feel your feet on the ground and notice the air filling your lungs. There is so much beauty in ordinary things if we only slow down to notice them. Be thankful for your breath, for your beating heart, and for the chance to learn something new today. When you practice gratitude, your worries begin to shrink, and your heart opens up with quiet joy. Cherish this present moment. It is a rare and precious gift that will never come again.`
},
{
  id: 'bright-future',
  title: 'Your Future Is Bright',
  desc: 'Every moment spent learning is an investment in the bright road ahead.',
  level: 'B1',
  text: `Keep your eyes on the horizon. The challenges you face today are preparing you for the great things waiting in your future. You are building skills, resilience, and wisdom that will open doors you cannot even imagine yet. Imagine the places you will visit, the wonderful friends you will make, and the dreams you will fulfill. Every minute you spend improving yourself is an investment in that bright future. Never let a difficult moment convince you to stop believing in your dreams. The road may be steep, but the view from the top is breathtaking. Keep walking with hope in your heart. Your story is just beginning, and the best is yet to come.`
}
];

/* ---------------- State and Helpers ---------------- */
function $(sel){ return document.querySelector(sel); }

var STORAGE_KEY = 'aloud_settings_v3';
var S = { wpm: 120 };
try {
  var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(saved && typeof saved === 'object'){
    if(saved.wpm) S.wpm = Math.min(260, Math.max(60, saved.wpm));
  }
} catch(e){}

function saveSettings(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch(e){}
}

/* ---------------- Web Speech API (Female Voice) ---------------- */
var voiceList = [];
function updateVoices(){
  if('speechSynthesis' in window){
    try { voiceList = window.speechSynthesis.getVoices(); } catch(e){ voiceList = []; }
  }
}
updateVoices();
if('speechSynthesis' in window){
  try { window.speechSynthesis.addEventListener('voiceschanged', updateVoices); } catch(e){}
}

function getFemaleVoice(){
  var enVoices = voiceList.filter(function(v){ return /^en/i.test(v.lang); });
  var femaleNameRegex = /(samantha|victoria|karen|zira|aria|jenny|susan|female|moira|tessa|serena|libby|sonia|hazel|google us english|google uk english female)/i;
  for(var i = 0; i < enVoices.length; i++){
    if(femaleNameRegex.test(enVoices[i].name)) return enVoices[i];
  }
  return enVoices[0] || null;
}

function speakPrompt(onDone){
  if(!('speechSynthesis' in window)){
    setTimeout(onDone, 1200);
    return;
  }
  try {
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance("Speak fast and clear");
    utterance.lang = "en-US";
    var voice = getFemaleVoice();
    if(voice) utterance.voice = voice;
    utterance.rate = 1.0;
    utterance.pitch = 1.05;

    var called = false;
    function finish(){
      if(!called){
        called = true;
        if(onDone) onDone();
      }
    }

    utterance.onend = finish;
    utterance.onerror = finish;
    setTimeout(finish, 2200); // Safety fallback

    window.speechSynthesis.speak(utterance);
  } catch(e){
    setTimeout(onDone, 1000);
  }
}

/* ---------------- DOM Elements ---------------- */
var homeView = $('#homeView');
var readerView = $('#readerView');
var topicsGrid = $('#topicsGrid');

var readerTitle = $('#readerTitle');
var readerSub = $('#readerSub');
var readerProgress = $('#readerProgress');

var stage = $('#stage');
var scroller = $('#scroller');
var textContent = $('#textContent');

var overlay = $('#overlay');
var ovPrerollBox = $('#ovPrerollBox');
var ovCountdown = $('#ovCountdown');
var ovDoneBox = $('#ovDoneBox');
var doneTime = $('#doneTime');
var doneSpeed = $('#doneSpeed');

var btnTogglePlay = $('#btnTogglePlay');
var btnRestart = $('#btnRestart');
var btnBack = $('#btnBack');
var btnReadAgain = $('#btnReadAgain');
var btnNextTopic = $('#btnNextTopic');
var btnDoneBack = $('#btnDoneBack');

var wpmSlider = $('#wpmSlider');
var wpmOutput = $('#wpmOutput');

/* ---------------- Application State ---------------- */
var curTopicIdx = 0;
var state = 'ready'; // 'ready', 'preroll', 'reading', 'paused', 'done'
var words = [];
var tops = new Float32Array(0);
var heights = new Float32Array(0);

var currentWordIdx = 0;
var ty = 0;
var lastRenderedTy = -999999;
var cachedScrollSpeed = 30;
var elapsed = 0;
var acc = 0;
var sessionToken = 0;
var readerVisible = false;

/* ---------------- Home Topics Grid ---------------- */
function renderHome(){
  topicsGrid.innerHTML = '';
  TOPICS.forEach(function(item, idx){
    var count = item.text.trim().split(/\s+/).length;
    var card = document.createElement('article');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', (idx + 1) + '. ' + item.title);

    var numStr = (idx + 1 < 10 ? '0' : '') + (idx + 1);

    card.innerHTML = 
      '<div class="card-number">Topic ' + numStr + ' · ' + item.level + '</div>' +
      '<h2 class="card-title">' + item.title + '</h2>' +
      '<p class="card-desc">' + item.desc + '</p>' +
      '<div class="card-meta">' +
        '<span>' + count + ' words</span>' +
        '<span>Start →</span>' +
      '</div>';

    card.addEventListener('click', function(){ openTopic(idx); });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openTopic(idx);
      }
    });

    topicsGrid.appendChild(card);
  });
}

/* ---------------- Text & Geometry Measuring ---------------- */
function buildText(topic){
  words = [];
  var frag = document.createDocumentFragment();
  var parts = topic.text.trim().split(/\s+/);

  parts.forEach(function(wordStr, idx){
    var span = document.createElement('span');
    span.className = 'w';
    span.textContent = wordStr;
    span.dataset.idx = idx;
    frag.appendChild(span);
    if(idx < parts.length - 1){
      frag.appendChild(document.createTextNode(' '));
    }
    words.push(span);
  });

  textContent.replaceChildren(frag);
  measureGeometry();
}

function measureGeometry(){
  var n = words.length;
  tops = new Float32Array(n);
  heights = new Float32Array(n);

  for(var i = 0; i < n; i++){
    var w = words[i];
    tops[i] = w.offsetTop;
    heights[i] = w.offsetHeight;
  }
  recalcScrollSpeed();
}

function recalcScrollSpeed(){
  var n = words.length;
  if(n > 1 && tops.length >= n){
    var totalDist = (tops[n - 1] + heights[n - 1] / 2) - (tops[0] + heights[0] / 2);
    cachedScrollSpeed = totalDist > 0 ? (totalDist / n) * (S.wpm / 60) : 32 * (S.wpm / 60);
  } else {
    cachedScrollSpeed = 32 * (S.wpm / 60);
  }
}

function alignToWord(targetIdx){
  if(!words.length) return;
  var idx = Math.max(0, Math.min(words.length - 1, targetIdx));
  var t = tops[idx] !== undefined ? tops[idx] : words[idx].offsetTop;
  var h = heights[idx] !== undefined ? heights[idx] : words[idx].offsetHeight;
  ty = (stage.clientHeight * 0.4) - (t + h / 2);
  lastRenderedTy = ty;
  scroller.style.transform = 'translate3d(0,' + ty.toFixed(1) + 'px,0)';
}

/* ---------------- Reader Controls & Flow ---------------- */
function openTopic(idx){
  sessionToken++;
  curTopicIdx = idx;
  var topic = TOPICS[idx];

  readerTitle.textContent = topic.title;
  readerSub.textContent = 'Topic ' + (idx + 1) + ' · ' + topic.level;

  buildText(topic);
  currentWordIdx = 0;
  elapsed = 0;
  acc = 0;
  state = 'preroll';

  updateReaderStatus();
  updateButtonLabels();

  homeView.hidden = true;
  readerView.hidden = false;
  readerVisible = true;
  document.documentElement.classList.add('in-reader');

  alignToWord(0);

  // Show preroll overlay
  overlay.hidden = false;
  ovPrerollBox.hidden = false;
  ovDoneBox.hidden = true;
  ovCountdown.textContent = '3';

  var currentSession = sessionToken;
  // Female voice says: "Speak fast and clear"
  speakPrompt(function(){
    if(currentSession !== sessionToken) return;
    runCountdown(3, currentSession);
  });
}

function runCountdown(count, token){
  if(token !== sessionToken) return;
  if(count <= 0){
    overlay.hidden = true;
    startReading();
    return;
  }
  ovCountdown.textContent = count;
  setTimeout(function(){
    runCountdown(count - 1, token);
  }, 700);
}

function startReading(){
  state = 'reading';
  alignToWord(currentWordIdx);
  updateButtonLabels();
}

function pauseReading(){
  if(state === 'reading'){
    state = 'paused';
    updateButtonLabels();
  }
}

function resumeReading(){
  if(state === 'paused'){
    state = 'reading';
    updateButtonLabels();
  }
}

function togglePlayPause(){
  if(state === 'reading'){
    pauseReading();
  } else if(state === 'paused'){
    resumeReading();
  } else if(state === 'done'){
    restartReading();
  }
}

function restartReading(){
  sessionToken++;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  currentWordIdx = 0;
  elapsed = 0;
  acc = 0;
  alignToWord(0);
  updateReaderStatus();

  state = 'preroll';
  updateButtonLabels();

  overlay.hidden = false;
  ovPrerollBox.hidden = false;
  ovDoneBox.hidden = true;
  ovCountdown.textContent = '3';

  var currentSession = sessionToken;
  speakPrompt(function(){
    if(currentSession !== sessionToken) return;
    runCountdown(3, currentSession);
  });
}

function finishReading(){
  state = 'done';
  updateButtonLabels();

  var sec = Math.max(1, Math.round(elapsed));
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  doneTime.textContent = m + ':' + (s < 10 ? '0' : '') + s;

  var avgWpm = Math.round(words.length / (elapsed / 60));
  doneSpeed.textContent = 'Average speed: ' + avgWpm + ' wpm · Total words: ' + words.length;

  ovPrerollBox.hidden = true;
  ovDoneBox.hidden = false;
  overlay.hidden = false;
}

function backToHome(){
  sessionToken++;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state = 'ready';
  readerVisible = false;

  readerView.hidden = true;
  homeView.hidden = false;
  document.documentElement.classList.remove('in-reader');
}

function updateButtonLabels(){
  if(state === 'reading'){
    btnTogglePlay.textContent = 'Pause';
  } else if(state === 'paused'){
    btnTogglePlay.textContent = 'Resume';
  } else if(state === 'done'){
    btnTogglePlay.textContent = 'Restart';
  } else {
    btnTogglePlay.textContent = 'Pause';
  }
}

function updateReaderStatus(){
  var total = words.length;
  var current = Math.min(total, currentWordIdx + 1);
  readerProgress.textContent = current + ' / ' + total;
}

/* ---------------- Speed Slider (Max 260 WPM) ---------------- */
function setWpm(val){
  var num = Math.min(260, Math.max(60, Math.round(val / 5) * 5));
  S.wpm = num;
  wpmSlider.value = num;
  wpmOutput.textContent = num;
  recalcScrollSpeed();
  saveSettings();
}

wpmSlider.addEventListener('input', function(){
  setWpm(+wpmSlider.value);
});

/* ---------------- Event Listeners ---------------- */
btnTogglePlay.addEventListener('click', togglePlayPause);
btnRestart.addEventListener('click', restartReading);
btnBack.addEventListener('click', backToHome);

btnReadAgain.addEventListener('click', restartReading);
btnNextTopic.addEventListener('click', function(){
  openTopic((curTopicIdx + 1) % TOPICS.length);
});
btnDoneBack.addEventListener('click', backToHome);

// Click on any word in the text to jump there
textContent.addEventListener('click', function(e){
  var span = e.target.closest('.w');
  if(!span || state === 'preroll' || state === 'done') return;
  acc = 0;
  var idx = +span.dataset.idx;
  currentWordIdx = idx;
  alignToWord(idx);
  updateReaderStatus();
});

// Pause / Resume by clicking reading stage
stage.addEventListener('click', function(e){
  if(e.target.closest('.w') || e.target.closest('.overlay') || e.target.closest('button')) return;
  if(state === 'reading') pauseReading();
  else if(state === 'paused') resumeReading();
});

// Keyboard navigation (Space: Pause/Resume, Esc: Back, Up/Down: Speed)
document.addEventListener('keydown', function(e){
  if(!readerVisible) return;
  var tag = e.target && e.target.tagName;
  if(e.code === 'Space'){
    if(tag === 'BUTTON' || tag === 'INPUT') return;
    e.preventDefault();
    togglePlayPause();
  } else if(e.key === 'Escape'){
    backToHome();
  } else if((e.key === 'ArrowUp' || e.key === 'ArrowDown') && tag !== 'INPUT'){
    e.preventDefault();
    setWpm(S.wpm + (e.key === 'ArrowUp' ? 5 : -5));
  }
});

// Debounced resize handler
var resizeTimer = 0;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    measureGeometry();
    if(readerVisible && state !== 'reading' && words.length){
      alignToWord(currentWordIdx);
    }
  }, 120);
});

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){
    measureGeometry();
  });
}

/* ---------------- Smooth Animation Loop ---------------- */
var lastTime = performance.now();

function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  if(document.hidden || !readerVisible) return;

  if(state === 'reading'){
    elapsed += dt;
    acc += dt;

    // Smooth continuous linear teleprompter scroll
    ty -= cachedScrollSpeed * dt;

    if(Math.abs(ty - lastRenderedTy) > 0.1){
      lastRenderedTy = ty;
      scroller.style.transform = 'translate3d(0,' + ty.toFixed(1) + 'px,0)';
    }

    // Advance word progress counter
    var wordDuration = 60 / S.wpm;
    var totalWords = words.length;

    while(state === 'reading' && acc >= wordDuration){
      acc -= wordDuration;
      if(currentWordIdx + 1 >= totalWords){
        finishReading();
        break;
      }
      currentWordIdx++;
      updateReaderStatus();
    }
  }
}

/* ---------------- Initialization ---------------- */
renderHome();
setWpm(S.wpm);
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
